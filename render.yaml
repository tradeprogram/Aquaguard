services:
  - type: web
    name: aquaguard-api
    runtime: python
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VWORLD_API_KEY
        sync: false
    healthCheckPath: /health
